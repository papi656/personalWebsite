<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Website - Wise Theme</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo">
                <div class="logo-text">Abhishek Pratap Singh</div>
            </div>
            <nav class="nav">
                
                <button class="menu-toggle" aria-label="Toggle navigation">
                    <div class="hamburger"></div>
                    <div class="hamburger"></div>
                    <div class="hamburger"></div>
                </button>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container">
                <h1>Welcome to My Personal Website</h1>
                <p>Exploring ideas, sharing thoughts, and showcasing projects.</p>
                
            </div>
        </section>

        <section class="countdown-section">
            <div class="container">
                <h2>Upcoming Event</h2>
                <div class="card countdown-card" data-target-date="2025-12-25T00:00:00">
                    <h3>Sample</h3>
                    <div class="countdown-display">
                        <div class="countdown-item">
                            <span class="value days">00</span>
                            <span class="label">days</span>
                        </div>
                        <div class="countdown-item">
                            <span class="value hours">00</span>
                            <span class="label">hours</span>
                        </div>
                        <div class="countdown-item">
                            <span class="value minutes">00</span>
                            <span class="label">minutes</span>
                        </div>
                        <div class="countdown-item">
                            <span class="value seconds">00</span>
                            <span class="label">seconds</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
    <footer>
        <div class="container">
            <p>&copy; 2025 Abhishek Pratap Singh. Version 0.0.1</p>
        </div>
    </footer>
</body>
</html>
