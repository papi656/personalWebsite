<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Website - Wise Theme</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo">
                <div class="logo-text">Abhishek Pratap Singh</div>
            </div>
            <nav class="nav">
                
                <button class="menu-toggle" aria-label="Toggle navigation">
                    <div class="hamburger"></div>
                    <div class="hamburger"></div>
                    <div class="hamburger"></div>
                </button>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container">
                <h1>Welcome to My Personal Website</h1>
                <p>Exploring ideas, sharing thoughts, and showcasing projects.</p>
                <button class="open-account-btn">Explore More</button>
            </div>
        </section>

        <section class="countdown-section">
            <div class="container">
                <h2>Upcoming Event</h2>
                <div class="card countdown-card" data-target-date="2025-12-25T00:00:00">
                    <h3>Christmas Countdown</h3>
                    <div class="countdown-display">
                        <span class="days">00</span> days
                        <span class="hours">00</span> hours
                        <span class="minutes">00</span> minutes
                        <span class="seconds">00</span> seconds
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
